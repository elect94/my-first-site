  <path d="M226 116 C214 128 196 136 172 140" stroke="#4a3d38" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M160 78 C185 66 225 66 252 82" stroke="#5a4a43" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M140 100 C160 88 190 84 214 88" stroke="#5a4a43" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- 눈썹 -->
  <path d="M146 166 Q164 158 182 164" stroke="#2b2220" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M218 164 Q236 158 254 166" stroke="#2b2220" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- 눈 -->
  <path d="M150 186 Q164 178 180 186" stroke="#2b2220" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M220 186 Q236 178 250 186" stroke="#2b2220" stroke-width="3" fill="none" stroke-linecap="round"/>
  <ellipse cx="165" cy="194" rx="8" ry="10" fill="#2a1f1c"/>
  <ellipse cx="235" cy="194" rx="8" ry="10" fill="#2a1f1c"/>
  <circle cx="168" cy="190" r="3" fill="#ffffff"/>
  <circle cx="238" cy="190" r="3" fill="#ffffff"/>
  <circle cx="162" cy="198" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="232" cy="198" r="1.5" fill="#ffffff" opacity="0.7"/>

  <!-- 코 -->
  <path d="M202 200 Q198 218 192 224 Q200 230 208 225" stroke="#d29a7b" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- 입: 살짝 미소 -->
  <path d="M182 246 Q200 258 218 246" stroke="#b55d4e" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M188 252 Q200 258 212 252" stroke="#e7a08e" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- 햇살 느낌 -->
  <rect width="400" height="400" fill="#fff6dc" opacity="0.08"/>
</svg>
