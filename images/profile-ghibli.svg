<svg xmlns="http://www.w3.org/2000/svg" viewBox="55 40 290 290">
  <defs>
    <!-- 하늘 -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fcbec"/>
      <stop offset="0.55" stop-color="#cfeaf5"/>
      <stop offset="1" stop-color="#f8edcf"/>
    </linearGradient>
    <!-- 피부 -->
    <radialGradient id="skin" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#fbe0c6"/>
      <stop offset="1" stop-color="#f0c4a2"/>
    </radialGradient>
    <!-- 머리카락 -->
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a2f2b"/>
      <stop offset="1" stop-color="#1c1716"/>
    </linearGradient>
    <!-- 정장 -->
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34405a"/>
      <stop offset="1" stop-color="#232b3d"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- 배경: 하늘, 구름, 언덕 -->
  <rect width="400" height="400" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.9" filter="url(#soft)">
    <ellipse cx="70" cy="90" rx="55" ry="22"/>
    <ellipse cx="105" cy="75" rx="35" ry="22"/>
    <ellipse cx="330" cy="120" rx="60" ry="20"/>
    <ellipse cx="300" cy="105" rx="30" ry="18"/>
    <ellipse cx="350" cy="50" rx="30" ry="10"/>
  </g>
  <path d="M0 300 C60 270 110 280 150 300 L150 400 L0 400 Z" fill="#9cc98a"/>
  <path d="M250 300 C300 265 360 270 400 290 L400 400 L250 400 Z" fill="#8bbf7b"/>
  <path d="M0 330 C80 310 140 320 200 340 L0 400 Z" fill="#7fb06d" opacity="0.8"/>

  <!-- 목 -->
  <path d="M172 240 L172 300 L228 300 L228 240 Z" fill="#e8b693"/>
  <path d="M172 262 C188 276 212 276 228 262 L228 285 L172 285 Z" fill="#d9a07f" opacity="0.7"/>

  <!-- 정장 -->
  <path d="M50 400 C58 330 110 298 176 290 L200 330 L224 290 C290 298 342 330 350 400 Z" fill="url(#suit)"/>
  <!-- 셔츠 -->
  <path d="M168 288 L200 372 L232 288 L214 284 L200 300 L186 284 Z" fill="#fbfbf7"/>
  <!-- 셔츠 깃 -->
  <path d="M186 282 L200 302 L178 318 L166 290 Z" fill="#ffffff" stroke="#d9dde3" stroke-width="1.5"/>
  <path d="M214 282 L200 302 L222 318 L234 290 Z" fill="#ffffff" stroke="#d9dde3" stroke-width="1.5"/>
  <!-- 넥타이 -->
  <path d="M192 302 L208 302 L205 318 L195 318 Z" fill="#a9c4dc"/>
  <path d="M195 318 L205 318 L214 372 L200 390 L186 372 Z" fill="#b9d1e6"/>
  <path d="M197 330 L203 330 M195 345 L205 345 M193 360 L207 360" stroke="#93b2cf" stroke-width="2" stroke-linecap="round"/>
  <!-- 라펠 -->
  <path d="M176 290 L200 372 L188 400 L150 400 L162 320 Z" fill="#2a3449"/>
  <path d="M224 290 L200 372 L212 400 L250 400 L238 320 Z" fill="#2a3449"/>
  <path d="M176 290 L200 372 M224 290 L200 372" stroke="#1b2232" stroke-width="2" fill="none"/>

  <!-- 귀 -->
  <ellipse cx="124" cy="190" rx="12" ry="20" fill="#efc09c"/>
  <ellipse cx="276" cy="190" rx="12" ry="20" fill="#efc09c"/>

  <!-- 얼굴 -->
  <path d="M128 150 C128 100 272 100 272 150 L270 200 C266 246 236 272 200 274 C164 272 134 246 130 200 Z" fill="url(#skin)"/>
  <!-- 머리카락 그림자 -->
  <path d="M136 140 C165 150 200 150 226 120 C240 140 255 145 266 140 L266 152 C250 158 236 152 226 140 C205 160 165 162 136 152 Z" fill="#dca283" opacity="0.5" filter="url(#soft)"/>

  <!-- 볼 홍조 -->
  <ellipse cx="152" cy="228" rx="16" ry="8" fill="#f2a08f" opacity="0.35"/>
  <ellipse cx="248" cy="228" rx="16" ry="8" fill="#f2a08f" opacity="0.35"/>

  <!-- 머리카락 -->
  <path d="M116 180 C100 100 150 52 206 54 C266 56 304 100 286 182
           C282 160 278 146 270 136
           C258 146 236 150 214 140
           C222 132 226 124 226 116
           C206 132 176 140 148 138
           C138 150 130 162 126 182 Z" fill="url(#hair)"/>
